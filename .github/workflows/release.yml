name: Release

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: "Existing Git tag to release (e.g. v1.2.0)"
        required: true
        type: string
      notes:
        description: Optional operator notes to prepend to generated release notes
        required: false
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.git_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG does not exist in the repository."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists. Refusing to redeploy it."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.git_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          if [ -z "$DEPLOY_HOST_FINGERPRINT" ]; then
            echo "DEPLOY_HOST_FINGERPRINT secret is required for SSH host key verification."
            exit 1
          fi

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ inputs.git_tag }}"
          SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
          SHORT_SHA="${SHA::12}"
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "release_tag=$TAG"
            echo "release_title=$TAG"
            echo "prefix=$PREFIX"
            echo "backend_image=${PREFIX}/backend:sha-${SHA}"
            echo "frontend_image=${PREFIX}/frontend:sha-${SHA}"
            echo "code_exec_image=${PREFIX}/code-exec:sha-${SHA}"
            echo "code_runner_image=${PREFIX}/code-runner:sha-${SHA}"
            echo "collab_image=${PREFIX}/collab:sha-${SHA}"
            echo "lsp_proxy_image=${PREFIX}/lsp-proxy:sha-${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Determine latest release behavior
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          latest_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.target_commitish' 2>/dev/null || true)"

          if [ -z "$latest_target" ]; then
            echo "mark_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_sha="$(git rev-parse "${latest_target}^{commit}" 2>/dev/null || true)"

          if [ -z "$latest_sha" ]; then
            echo "mark_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$latest_sha" "$TARGET_SHA"; then
            echo "mark_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "mark_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify published images exist
        run: |
          docker buildx imagetools inspect "${{ steps.meta.outputs.backend_image }}" > /dev/null
          docker buildx imagetools inspect "${{ steps.meta.outputs.frontend_image }}" > /dev/null
          docker buildx imagetools inspect "${{ steps.meta.outputs.code_exec_image }}" > /dev/null
          docker buildx imagetools inspect "${{ steps.meta.outputs.code_runner_image }}" > /dev/null
          docker buildx imagetools inspect "${{ steps.meta.outputs.collab_image }}" > /dev/null
          docker buildx imagetools inspect "${{ steps.meta.outputs.lsp_proxy_image }}" > /dev/null

      - name: Copy release files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: docker-compose.prod.yml,scripts/release.sh
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Release via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash "${{ secrets.DEPLOY_PATH }}/scripts/release.sh" \
              "${{ secrets.DEPLOY_PATH }}" \
              "${{ steps.meta.outputs.release_tag }}" \
              "${{ steps.meta.outputs.sha }}" \
              "${{ steps.meta.outputs.backend_image }}" \
              "${{ steps.meta.outputs.frontend_image }}" \
              "${{ steps.meta.outputs.code_exec_image }}" \
              "${{ steps.meta.outputs.code_runner_image }}" \
              "${{ steps.meta.outputs.collab_image }}" \
              "${{ steps.meta.outputs.lsp_proxy_image }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_NOTES: ${{ inputs.notes }}
          MARK_LATEST: ${{ steps.latest.outputs.mark_latest }}
        run: |
          SUMMARY="$(cat <<EOF
          Deployed commit: \`${{ steps.meta.outputs.sha }}\`
          Source tag: \`${{ inputs.git_tag }}\`
          Updated latest release pointer: \`${MARK_LATEST}\`

          Images:
          - \`${{ steps.meta.outputs.backend_image }}\`
          - \`${{ steps.meta.outputs.frontend_image }}\`
          - \`${{ steps.meta.outputs.code_exec_image }}\`
          - \`${{ steps.meta.outputs.code_runner_image }}\`
          - \`${{ steps.meta.outputs.collab_image }}\`
          - \`${{ steps.meta.outputs.lsp_proxy_image }}\`
          EOF
          )"

          if [ -n "$INPUT_NOTES" ]; then
            SUMMARY="${SUMMARY}

          Operator notes:
          ${INPUT_NOTES}"
          fi

          release_cmd=(
            gh release create "${{ steps.meta.outputs.release_tag }}"
            --target "${{ steps.meta.outputs.sha }}"
            --title "${{ steps.meta.outputs.release_title }}"
            --generate-notes
            --notes "$SUMMARY"
          )

          if [ "$MARK_LATEST" = "true" ]; then
            release_cmd+=(--latest)
          else
            release_cmd+=(--latest=false)
          fi

          "${release_cmd[@]}"

      - name: Summarize release
        run: |
          {
            echo "## Released to Production"
            echo ""
            echo "- Commit: \`${{ steps.meta.outputs.sha }}\`"
            echo "- Backend: \`${{ steps.meta.outputs.backend_image }}\`"
            echo "- Frontend: \`${{ steps.meta.outputs.frontend_image }}\`"
            echo "- Code Exec: \`${{ steps.meta.outputs.code_exec_image }}\`"
            echo "- Code Runner: \`${{ steps.meta.outputs.code_runner_image }}\`"
            echo "- Collab: \`${{ steps.meta.outputs.collab_image }}\`"
            echo "- LSP Proxy: \`${{ steps.meta.outputs.lsp_proxy_image }}\`"
            echo "- Updated latest release pointer: \`${{ steps.latest.outputs.mark_latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
