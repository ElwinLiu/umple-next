name: umpleonline-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - ./data/models:/data/models
      - ./jars:/jars:ro
      - ./examples:/examples:ro
      - /usr/local/bin/txl:/usr/local/bin/txl:ro
      - /usr/local/lib/txl:/usr/local/lib/txl:ro
    environment:
      - UMPLE_SYNC_JAR=/jars/umplesync.jar
      - MODEL_STORE_PATH=/data/models
      - EXAMPLE_PATH=/examples
      - EXECUTION_URL=http://code-exec:4400
      - PORT=3001
    depends_on:
      code-exec:
        condition: service_healthy

  collab:
    build:
      context: ./collab
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    volumes:
      - ./collab:/app
      - /app/node_modules
    environment:
      - PORT=3002
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  lsp-proxy:
    build:
      context: .
      dockerfile: lsp-proxy/Dockerfile
      args:
        UMPLE_LSP_VERSION: ${UMPLE_LSP_VERSION:-latest}
    ports:
      - "9999:9999"
    volumes:
      - ./data/models:/data/models
      - ./jars:/jars:ro
    environment:
      - UMP_BASE_DIR=/data/models
      - UMPLESYNC_JAR_PATH=/jars/umplesync.jar
      - LSP_PORT=9999
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const W=require('ws'),c=new W('ws://127.0.0.1:9999');c.on('open',()=>{c.close();process.exit(0)});c.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  code-exec:
    build:
      context: ./code-exec
    ports:
      - "4400:4400"
    environment:
      - EXECUTION_RUNNER_IMAGE=${CODE_RUNNER_IMAGE:-umple-code-runner:dev}
      - EXECUTION_RUNNER_AUTO_BUILD=1
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/models:/data/models
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
